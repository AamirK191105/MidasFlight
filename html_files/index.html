<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Midas Flight, a fast-paced Flappy Bird-style arcade game.">
  <title>Play Midas Flight</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav>
    <ul aria-label="Primary navigation">
      <li><a href="../html_files/index.html" aria-current="page">Game</a></li>
      <li><a href="../html_files/signup.html">Register</a></li>
      <li><a href="../html_files/login.html">Login</a></li>
      <li><a href="../html_files/leaderboards.html">Leaderboard</a></li>
    </ul>
  </nav>

  <main class="game-shell">
    <header class="page-heading">
      <h1>Midas Flight</h1>
      <h2>The escape from capitalism.</h2>
    </header>

    <div class="user-section" aria-live="polite">
      <span id="user-display"></span>
      <button id="signout-btn" type="button" style="display: none;">Sign out</button>
    </div>

    <section class="how-to-play" aria-labelledby="how-to-play-title">
      <h3 id="how-to-play-title">How to play</h3>
      <div class="instructions">
        <p><strong>Controls:</strong> Press <kbd>Space</kbd> or <kbd>Up Arrow</kbd> to fly</p>
        <p><strong>Objective:</strong> Navigate through the pipes and collect coins</p>
        <p><strong>Scoring:</strong> Build combos, pass pipes, and collect coins</p>
        <p><strong>Restart:</strong> Press <kbd>Space</kbd> after game over</p>
      </div>
    </section>

    <canvas id="board" width="750" height="650" aria-label="Midas Flight game board"></canvas>
  </main>

  <script src="../js_files/transitions.js"></script>
  <script type="module" src="../js_files/midasflight.js"></script>
  <script>
    // Display user info and sign out button
    const currentUser = JSON.parse(sessionStorage.getItem("currentuser"));
    const userDisplay = document.getElementById("user-display");
    const signoutBtn = document.getElementById("signout-btn");

    if (!currentUser) {
      // No user logged in - redirect to login page
      window.location.href = "login.html";
    } else if (currentUser.isGuest) {
      // Guest user
      userDisplay.textContent = "Playing as Guest";
    } else {
      // Registered user
      userDisplay.textContent = `Welcome, ${currentUser.firstname}!`;
      signoutBtn.style.display = "inline-block";
    }

    // Sign out functionality
    signoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("currentuser");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
