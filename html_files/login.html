<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Midas Flight</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav>
    <ul aria-label="Primary navigation">
      <li><a href="../html_files/index.html">Game</a></li>
      <li><a href="../html_files/signup.html">Register</a></li>
      <li><a href="../html_files/login.html" aria-current="page">Login</a></li>
      <li><a href="../html_files/leaderboards.html">Leaderboard</a></li>
    </ul>
  </nav>

  <main class="page-container">
  <section class="form-container" aria-labelledby="login-title">
    <h1 id="login-title">Log in</h1>
    
    <div id="error-message" role="alert" aria-live="assertive"></div>
    <div id="success-message" role="status" aria-live="polite"></div>
    
    <form id="form">
      <label for="email-input">Email address</label>
      <input 
        type="email" 
        id="email-input" 
        autocomplete="email"
        placeholder="you@example.com"
        required
      >
      
      <label for="password-input">Password</label>
      <input 
        type="password" 
        id="password-input" 
        autocomplete="current-password"
        placeholder="Your password"
        required
      >
      
      <button type="submit">Login</button>
    </form>

    <!-- Guest Login Button -->
    <div class="guest-option">
      <p style="text-align: center; color: #888; margin: 15px 0;">OR</p>
      <button id="guest-btn" class="guest-button">Continue as Guest</button>
      <p style="text-align: center; color: #aaa; font-size: 0.9rem; margin-top: 10px;">
        Note: Guest scores won't be saved to the leaderboard
      </p>
    </div>
    
    <p style="text-align: center; margin-top: 15px; color: white;">
      Don't have an account? <a href="signup.html" style="color: #ffd700;">Sign Up</a>
    </p>
  </section>
  </main>

  <script src="../js_files/transitions.js"></script>
  <script type="module" src="../js_files/auth.js"></script>
  <script type="module">
    // Guest login functionality - UPDATED to use sessionStorage
    document.getElementById("guest-btn").addEventListener("click", () => {
      const guestUser = {
        firstname: "Guest",
        email: "guest@temporary.com",
        isGuest: true
      };
      sessionStorage.setItem("currentuser", JSON.stringify(guestUser));
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
