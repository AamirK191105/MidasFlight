<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account - Midas Flight</title>

  <!-- Link to the main stylesheet for consistent design -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <!-- =========================
       NAVIGATION BAR SECTION
       Contains links to all pages in the project
  ========================== -->
  <nav>
    <ul aria-label="Primary navigation">
      <li><a href="../html_files/index.html">Game</a></li>
      <li><a href="../html_files/signup.html" aria-current="page">Register</a></li>
      <li><a href="../html_files/login.html">Login</a></li>
      <li><a href="../html_files/leaderboards.html">Leaderboard</a></li>
    </ul>
  </nav>

  <!-- =========================
       SIGNUP FORM WRAPPER
       Holds the entire registration form
  ========================== -->
  <main class="page-container">
  <section class="wrapper" aria-labelledby="signup-title">
    <h1 id="signup-title">Create your account</h1>

    <!-- Error display area for JavaScript validation messages -->
    <p id="error-box"></p>

    <!-- =========================
         MAIN SIGNUP FORM
         Users enter their details here
    ========================== -->
    <form id="form">

      <!-- These two divs show text feedback (validation or success) -->
      <div id="error-message"></div>
      <div id="success-message"></div>

      <!-- USER INPUT FIELDS -->
      <div><label for="firstname-input">First name</label>
        <input type="text" id="firstname-input" autocomplete="given-name" placeholder="Your first name" required></div>

      <div><label for="email-input">Email address</label>
        <input type="email" id="email-input" autocomplete="email" placeholder="you@example.com" required></div>

      <div><label for="age-input">Age</label>
        <input type="number" id="age-input" autocomplete="off" placeholder="Your age" min="1" max="120" required></div>

      <div><label for="password-input">Password</label>
        <input type="password" id="password-input" autocomplete="new-password" placeholder="Create a password" required></div>

      <div><label for="repeat-password-input">Confirm password</label>
        <input type="password" id="repeat-password-input" autocomplete="new-password" placeholder="Repeat your password" required></div>

      <!-- Submit button for signup -->
      <button type="submit">Sign up</button>
    </form>

    <!-- Redirect link for users who already have an account -->
    <p>Already signed up? <a href="login.html">Login</a></p>
  </section>
  </main>

  <!-- =========================
       JAVASCRIPT LINKS
       - auth.js handles form validation & registration logic
       - transitions.js can handle visual effects or page animations
  ========================== -->
  <script type="module" src="../js_files/auth.js"></script>
  <script src="../js_files/transitions.js"></script>

</body>
</html>
